# StudyOS v1 model routing tiers.

tiers:
  fast:
    purpose: "Low-cost, low-risk extraction and formatting."
    use_for:
      - "import proposal metadata"
      - "inventory"
      - "file classification"
      - "simple metadata extraction"
      - "format cleanup"
    avoid_for:
      - "cross-source merging"
      - "validation"
      - "exam question design"
      - "formula display LaTeX quality decisions"

  balanced:
    purpose: "Default course-material processing."
    use_for:
      - "conceptual batch planning for normal courses"
      - "source digests"
      - "learning cores"
      - "complete study notes for normal batches"
      - "standard question generation"
      - "standard explanations"
    avoid_for:
      - "high-stakes audit"
      - "ambiguous or mathematically dense material"

  deep:
    purpose: "Complex reasoning and merging."
    use_for:
      - "rigorous quality mode"
      - "difficult concepts"
      - "formula derivations"
      - "display LaTeX formula sheets"
      - "essential visual analysis"
      - "exam questions"
      - "final merge"
    avoid_for:
      - "bulk inventory"
      - "mechanical formatting"

  audit:
    purpose: "Independent checks of correctness and traceability."
    use_for:
      - "citation validation"
      - "formula validation"
      - "visual coverage validation"
      - "coverage review"
      - "unsupported claim detection"
    avoid_for:
      - "first-pass generation"
      - "bulk summarization"

defaults:
  import_proposal: "fast"
  inventory: "fast"
  planning: "balanced"
  digest: "balanced"
  learning_core: "balanced"
  essential_visual_analysis: "deep"
  formula_sheet: "deep"
  exam_questions: "deep"
  validation: "audit"
  merge: "deep"

agent_execution_policy:
  primary_mode: "agent_driven_with_scripted_preflight_validation_and_export"
  objective: "Maximize source-grounded output quality and exhaustive assigned-input coverage; optimize tokens only after those are protected."
  priority_order:
    - "output_quality"
    - "complete_assigned_input_coverage"
    - "validation_cleanliness"
    - "time_and_token_efficiency"
  context_strategy:
    - "Read planning files and source inventories before raw source content."
    - "Process one conceptual batch at a time; never load the whole course when a batch is sufficient."
    - "Start with file metadata, headings, tables of contents, slide titles, abstracts, summaries, and visible formulas to build a reading plan."
    - "Read full source content only for assigned batch sources and only after the Source Coverage checklist is prepared."
    - "Prefer targeted rereads of uncertain sections over broad rereads of already-covered material."
    - "Reuse existing digests, learning cores, visual notes, and validation reports when current."
  token_optimization:
    - "Spend minimal tokens on setup, import, inventory, formatting, and mechanical classification."
    - "Spend most tokens on digest completeness, learning-core depth, formula correctness, visual essentials, exam-quality questions, and validation repair."
    - "Do not spend tokens producing removed outputs or ornamental summaries."
    - "Use concise internal notes for obvious facts and detailed internal notes for hard, examinable, formula-heavy, or visually grounded material."
    - "Escalate only the affected section to deeper reasoning instead of rerunning an entire batch."
    - "Never save tokens by dropping unique assigned-source content from final outputs."
    - "Long outputs are acceptable when long outputs are necessary for exhaustive coverage."
  escalation_rules:
    use_deep_when:
      - "Formula notation, assumptions, or derivations are ambiguous."
      - "A visual contains examinable definitions, formulas, tables, charts, or model structure."
      - "Multiple sources conflict or use different notation."
      - "Exam questions require integration across concepts."
      - "Merged outputs require cross-batch deduplication or dependency reasoning."
    use_audit_when:
      - "Validating coverage, citations, formulas, unsupported claims, visual handling, or stale outputs."
      - "Deciding whether a blocking issue can be carried as unresolved."
  stopping_rules:
    - "Stop instead of guessing when assigned source material is unreadable, missing, contradictory, or too ambiguous to ground an output."
    - "Stop before downstream work when validation has blocking findings."
    - "Carry uncertainty visibly in review files and final outputs only when the user explicitly accepts the unresolved risk."

output_scope:
  student_facing_defaults:
    - "notes"
    - "formulas"
    - "exam_practice_questions"
  removed_defaults:
    - "flashcards"
    - "cheat_sheets"
    - "study_plans"
    - "final_review_packs"
  routing_policy:
    - "Do not spend model calls generating removed default outputs."
    - "Use saved effort for complete study notes, display-LaTeX formulas, exam practice questions, source coverage, visual coverage, and validation."
    - "Exam practice questions replace flashcards as the active-recall and practice layer."

quality_mode_overrides:
  economy:
    prefer:
      inventory: "fast"
      planning: "fast"
      digest: "balanced"
      learning_core: "balanced"
      validation: "audit"
    visual_depth: "minimal"
    formula_depth: "normal"
    validation_depth: "structural_or_standard"
  standard:
    prefer:
      inventory: "fast"
      planning: "balanced"
      digest: "balanced"
      learning_core: "balanced"
      formula_sheet: "deep"
      exam_questions: "deep"
      validation: "audit"
      merge: "deep"
    visual_depth: "standard"
    formula_depth: "normal"
    validation_depth: "standard"
  rigorous:
    prefer:
      planning: "deep"
      digest: "deep_for_difficult_batches_else_balanced"
      learning_core: "deep_for_difficult_batches_else_balanced"
      essential_visual_analysis: "deep"
      formula_sheet: "deep"
      exam_questions: "deep"
      validation: "audit"
      merge: "deep"
    visual_depth: "rigorous"
    formula_depth: "rigorous"
    validation_depth: "rigorous_audit"

repair_policy:
  route_only_affected_sections_to_deeper_models: true
  preserve_valid_content: true
  rerun_validation_after_repair: true
