# StudyOS v1 model routing tiers.

tiers:
  fast:
    purpose: "Low-cost, low-risk extraction and formatting."
    use_for:
      - "import proposal metadata"
      - "inventory"
      - "file classification"
      - "simple metadata extraction"
      - "format cleanup"
    avoid_for:
      - "cross-source merging"
      - "validation"
      - "exam question design"
      - "formula display LaTeX quality decisions"

  balanced:
    purpose: "Default course-material processing."
    use_for:
      - "conceptual batch planning for normal courses"
      - "source digests"
      - "learning cores"
      - "complete study notes for normal batches"
      - "standard question generation"
      - "standard explanations"
    avoid_for:
      - "high-stakes audit"
      - "ambiguous or mathematically dense material"

  deep:
    purpose: "Complex reasoning and merging."
    use_for:
      - "rigorous quality mode"
      - "difficult concepts"
      - "formula derivations"
      - "display LaTeX formula sheets"
      - "essential visual analysis"
      - "exam questions"
      - "final merge"
    avoid_for:
      - "bulk inventory"
      - "mechanical formatting"

  audit:
    purpose: "Independent checks of correctness and traceability."
    use_for:
      - "citation validation"
      - "formula validation"
      - "visual coverage validation"
      - "coverage review"
      - "unsupported claim detection"
    avoid_for:
      - "first-pass generation"
      - "bulk summarization"

defaults:
  import_proposal: "fast"
  inventory: "fast"
  planning: "balanced"
  digest: "balanced"
  learning_core: "balanced"
  essential_visual_analysis: "deep"
  formula_sheet: "deep"
  exam_questions: "deep"
  validation: "audit"
  merge: "deep"

output_scope:
  student_facing_defaults:
    - "notes"
    - "formulas"
    - "exam_practice_questions"
  removed_defaults:
    - "flashcards"
    - "cheat_sheets"
    - "study_plans"
    - "final_review_packs"
  routing_policy:
    - "Do not spend model calls generating removed default outputs."
    - "Use saved effort for complete study notes, display-LaTeX formulas, exam practice questions, source coverage, visual coverage, and validation."
    - "Exam practice questions replace flashcards as the active-recall and practice layer."

quality_mode_overrides:
  economy:
    prefer:
      inventory: "fast"
      planning: "fast"
      digest: "balanced"
      learning_core: "balanced"
      validation: "audit"
    visual_depth: "minimal"
    formula_depth: "normal"
    validation_depth: "structural_or_standard"
  standard:
    prefer:
      inventory: "fast"
      planning: "balanced"
      digest: "balanced"
      learning_core: "balanced"
      formula_sheet: "deep"
      exam_questions: "deep"
      validation: "audit"
      merge: "deep"
    visual_depth: "standard"
    formula_depth: "normal"
    validation_depth: "standard"
  rigorous:
    prefer:
      planning: "deep"
      digest: "deep_for_difficult_batches_else_balanced"
      learning_core: "deep_for_difficult_batches_else_balanced"
      essential_visual_analysis: "deep"
      formula_sheet: "deep"
      exam_questions: "deep"
      validation: "audit"
      merge: "deep"
    visual_depth: "rigorous"
    formula_depth: "rigorous"
    validation_depth: "rigorous_audit"

repair_policy:
  route_only_affected_sections_to_deeper_models: true
  preserve_valid_content: true
  rerun_validation_after_repair: true
