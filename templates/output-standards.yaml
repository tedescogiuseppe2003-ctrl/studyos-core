# StudyOS v1 output standards.

quality_modes:
  economy:
    master_notes:
      words_per_batch: "800-1200"
    flashcards:
      count_per_batch: "15-25"
    exam_questions:
      count_per_batch: "5-10"
    formula_sheet:
      depth: "only essential formulas"

  standard:
    master_notes:
      words_per_batch: "1200-2200"
    flashcards:
      count_per_batch: "25-45"
    exam_questions:
      count_per_batch: "8-18"
    formula_sheet:
      depth: "all important formulas"

  rigorous:
    master_notes:
      words_per_batch: "as long as needed for completeness"
    flashcards:
      count_per_batch: "40-70 per batch if exam-heavy"
    exam_questions:
      count_per_batch: "15-30"
    formula_sheet:
      depth: "formulas, assumptions, derivations, common mistakes"

outputs:
  import_plan:
    file: "analysis/inventory/import_plan.md"
    required_sections:
      - "Summary"
      - "Plan"

  import_log:
    file: "analysis/inventory/import_log.md"
    required_sections:
      - "Summary"
      - "Log"

  course_inventory:
    file: "analysis/inventory/course_inventory.md"
    required_sections:
      - "Course Inventory"

  batch_plan:
    file: "analysis/inventory/batch_plan.md"
    required_sections:
      - "Batch Plan"
    required_batch_fields:
      - "title"
      - "status"
      - "difficulty"
      - "exam relevance"
      - "depends on"
      - "primary sources"
      - "supporting sources"
      - "expected outputs"
      - "notes"

  batch_plan_repair_log:
    file: "analysis/inventory/batch_plan_repair_log.md"
    required_sections:
      - "Summary"
      - "Changes"
      - "Unassigned Files"
      - "Dependencies"
      - "Warnings"

  digest:
    file: "analysis/batches/<batch>_digest.md"
    required_sections:
      - "Batch Processing Plan"
      - "Source Coverage"
      - "Visual Coverage"
      - "Core extracted content"
      - "Definitions"
      - "Formulas"
      - "Important tables/charts/diagrams"
      - "Examples"
      - "Weak points"
      - "Unresolved questions"
      - "Source references"

  learning_core:
    file: "analysis/batches/<batch>_learning_core.md"
    required_sections:
      - "Learning Objectives"
      - "Core Concepts"
      - "Explanations"
      - "Connections Between Topics"
      - "Worked Examples"
      - "Common Mistakes"
      - "Exam-Relevant Points"
      - "Weak Points"
      - "Unresolved Questions"
      - "Source References"

  visual_notes:
    file: "analysis/visual/<batch>_visual_notes.md"
    condition: "required only when visual findings exist"
    required_sections:
      - "Visual Scope"
      - "Essential Visuals"
      - "Findings"
      - "Unresolved Visual Issues"
      - "Source References"

  batch_notes:
    file: "outputs/notes/<batch>.md"
    required_sections:
      - "Scope"
      - "Core Notes"
      - "Definitions"
      - "Examples"
      - "Weak Points"
      - "Source References"

  formula_sheet:
    file: "outputs/formulas/<batch>_formulas.md"
    condition: "required only when formulas exist"
    required_sections:
      - "Notation"
      - "Formula Index"
      - "Formulas"
      - "Variable Definitions"
      - "Assumptions"
      - "When To Use"
      - "Source References"

  flashcards:
    file: "outputs/flashcards/<batch>_flashcards.md"
    required_sections:
      - "Deck Scope"
      - "Concept Cards"
      - "Definition Cards"
      - "Formula Cards"
      - "Application Cards"
      - "Weak Point Cards"
      - "Source References"

  exam_questions:
    file: "outputs/questions/<batch>_questions.md"
    required_sections:
      - "Exam Scope"
      - "Question Set"
      - "Answer Key"
      - "Worked Solutions"
      - "Grading Notes"
      - "Common Pitfalls"
      - "Source References"

  full_course_notes:
    file: "outputs/notes/full_course_notes.md"
    required_sections:
      - "Scope"
      - "Dependency Map"
      - "Consolidated Notes"
      - "Definitions"
      - "Examples"
      - "Weak Points"
      - "Unresolved Questions"
      - "Exam-Relevant Visual Findings"
      - "Source References"

  full_formula_sheet:
    file: "outputs/formulas/full_formula_sheet.md"
    required_sections:
      - "Notation"
      - "Formula Index"
      - "Formulas"
      - "Variable Definitions"
      - "Assumptions"
      - "When To Use"
      - "Dependencies"
      - "Common Mistakes"
      - "Source References"

  full_flashcards:
    file: "outputs/flashcards/full_flashcards.md"
    required_sections:
      - "Deck Scope"
      - "Concept Cards"
      - "Definition Cards"
      - "Formula Cards"
      - "Application Cards"
      - "Weak Point Cards"
      - "Source References"

  full_question_bank:
    file: "outputs/questions/full_question_bank.md"
    required_sections:
      - "Exam Scope"
      - "Likely Exam Questions"
      - "Question Set"
      - "Answer Key"
      - "Worked Solutions"
      - "Grading Notes"
      - "Common Pitfalls"
      - "Source References"

  final_cheat_sheet:
    file: "outputs/cheat-sheets/final_cheat_sheet.md"
    required_sections:
      - "Exam-Critical Concepts"
      - "Notation"
      - "Key Formulas"
      - "Common Pitfalls"
      - "Weak Points"
      - "Last Checks"
      - "Source References"

  full_course_study_plan:
    file: "outputs/study-plan/full_course_study_plan.md"
    required_sections:
      - "Study Scope"
      - "Dependencies"
      - "7-Day Plan"
      - "Last 48 Hours"
      - "Weak Point Priorities"
      - "Unresolved Questions"

  final_review_pack:
    file: "outputs/final-pack/final_review_pack.md"
    required_sections:
      - "Summary"
      - "Priority Review"
      - "Weak Points"
      - "Unresolved Questions"
      - "Likely Exam Questions"
      - "Formula Review"
      - "Exam-Relevant Visual Findings"
      - "7-Day Plan"
      - "Last 48 Hours"
      - "Source References"

  validation_report:
    file: "review/validation-report.md"
    required_sections:
      - "Summary"
      - "Required Output Categories"
      - "Findings"
    severity_levels:
      - "low"
      - "medium"
      - "high"
      - "blocking"

  source_coverage:
    file: "review/source-coverage.md"
    required_sections:
      - "Summary"
      - "File Coverage"

  validation_details:
    folder: "analysis/validation/"
    required_for: "studyos-validate deterministic and LLM audit notes"

  visual_issues:
    file: "review/visual-issues.md"
    condition: "required when essential visuals are unresolved or visually grounded claims need repair"

  unresolved_questions:
    file: "review/unresolved-questions.md"
    condition: "required when validation leaves unanswered source, formula, or visual questions"

rules:
  require_source_references: true
  final_outputs_must_use_learning_cores: true
  unresolved_questions_must_be_flagged: true
  weak_points_must_be_carried_forward: true
  merge_does_not_mean_concatenate: true
  merged_outputs_must_consolidate_duplicate_concepts: true
  merged_outputs_must_harmonize_notation: true
  merged_formula_sheets_must_deduplicate_formulas: true
  merged_outputs_must_identify_dependencies: true
  merged_outputs_must_include_likely_exam_questions: true
  merged_outputs_must_include_final_7_day_and_last_48_hour_plans: true
  merged_outputs_must_include_exam_relevant_visual_findings: true
  visual_screening_integrated_in_batch: true
  visual_coverage_required_for_slide_pdf_image_batches: true
  essential_visuals_must_be_analyzed_or_unresolved: true
  flashcards_must_be_active_recall: true
  exam_questions_must_include_expected_answers: true
  exercises_must_be_integrated_as_practice: true
  unsupported_claims_must_be_flagged: true
  validation_repair_policy: "targeted repair; preserve valid content; do not regenerate unrelated outputs; rerun validation after repair"
  separate_visual_skill_required: false
