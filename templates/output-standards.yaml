# StudyOS v1 output standards.

quality_modes:
  economy:
    master_notes:
      words_per_batch: "800-1200"
    flashcards:
      count_per_batch: "15-25"
    exam_questions:
      count_per_batch: "5-10"
    formula_sheet:
      depth: "only essential formulas"

  standard:
    master_notes:
      words_per_batch: "1200-2200"
    flashcards:
      count_per_batch: "25-45"
    exam_questions:
      count_per_batch: "8-18"
    formula_sheet:
      depth: "all important formulas"

  rigorous:
    master_notes:
      words_per_batch: "as long as needed for completeness"
    flashcards:
      count_per_batch: "40-70 per batch if exam-heavy"
    exam_questions:
      count_per_batch: "15-30"
    formula_sheet:
      depth: "formulas, assumptions, derivations, common mistakes"

outputs:
  import_plan:
    file: "analysis/inventory/import_plan.md"
    required_sections:
      - "Summary"
      - "Plan"

  import_log:
    file: "analysis/inventory/import_log.md"
    required_sections:
      - "Summary"
      - "Log"

  course_inventory:
    file: "analysis/inventory/course_inventory.md"
    required_sections:
      - "Course Inventory"

  batch_plan:
    file: "analysis/inventory/batch_plan.md"
    required_sections:
      - "Batch Plan"

  digest:
    file: "analysis/batches/digest.md"
    required_sections:
      - "Scope"
      - "Source List"
      - "Batch Processing Plan"
      - "Source Coverage"
      - "Key Topics"
      - "Important Details"
      - "Definitions"
      - "Formulas"
      - "Examples"
      - "Weak Points"
      - "Unresolved Questions"
      - "Source References"

  learning_core:
    file: "analysis/batches/learning-core.md"
    required_sections:
      - "Learning Objectives"
      - "Core Concepts"
      - "Explanations"
      - "Connections Between Topics"
      - "Worked Examples"
      - "Common Mistakes"
      - "Exam-Relevant Points"
      - "Weak Points"
      - "Unresolved Questions"
      - "Source References"

  formula_sheet:
    file: "outputs/formulas/formula-sheet.md"
    required_sections:
      - "Notation"
      - "Formula Index"
      - "Formulas"
      - "Variable Definitions"
      - "Assumptions"
      - "When To Use"
      - "Source References"

  flashcards:
    file: "outputs/flashcards/flashcards.md"
    required_sections:
      - "Deck Scope"
      - "Concept Cards"
      - "Definition Cards"
      - "Formula Cards"
      - "Application Cards"
      - "Weak Point Cards"
      - "Source References"

  exam_questions:
    file: "outputs/questions/exam-questions.md"
    required_sections:
      - "Exam Scope"
      - "Question Set"
      - "Answer Key"
      - "Worked Solutions"
      - "Grading Notes"
      - "Common Pitfalls"
      - "Source References"

rules:
  require_source_references: true
  final_outputs_must_use_learning_cores: true
  unresolved_questions_must_be_flagged: true
  weak_points_must_be_carried_forward: true
