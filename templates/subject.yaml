# StudyOS course configuration.
# The installing agent should fill this from the setup answers.

subject:
  name: ""
  level: ""
  language: ""
  exam_type: ""

raw_source:
  path: ""
  mode: "read_only"
  copy_strategy: "copy_into_inputs"

processing:
  mode: "manual_guided"
  batch_strategy: "conceptual_batches"
  process_incrementally: true
  require_validation: true
  allow_parallel_batches: false

outputs:
  master_notes: true
  formula_sheets: true
  flashcards: true
  exam_questions: true
  cheat_sheets: true
  study_plan: true
  final_review_pack: true

multimodal:
  enabled: true
  visual_analysis: "lazy"
  analyze_tables: true
  analyze_charts: true
  analyze_decorative_images: false

validation:
  deterministic_checks: true
  llm_review: true
  require_citations: true
  require_formula_sources: true
  detect_stale_outputs: true

graphify:
  enabled: false

model_routing:
  inventory: "fast"
  extraction: "balanced"
  concept_building: "balanced"
  formula_audit: "audit"
  output_generation: "balanced"
  validation: "audit"
