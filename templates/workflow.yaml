# StudyOS v1.1 workflow.

workflow:
  install:
    skill: "study-os-install"
    purpose: "Create the separate StudyOS workspace without touching the raw source folder."
    inputs:
      - "StudyOS core templates/"
      - "StudyOS core scripts/"
      - "StudyOS core skills/"
    outputs:
      - "subject.yaml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "workflow.yaml"
      - "output-standards.yaml"
      - "model-routing.yaml"
      - "inputs/"
      - "working/"
      - "outputs/"
      - "review/"
      - "study-os/"
      - ".agents/"
      - ".claude/"
    checks:
      - "raw_source_folder_is_external_and_read_only"
      - "required_workspace_directories_exist"
      - "inputs_is_empty_or_imported_copy_area"

  import_sources_proposal:
    skill: "study-os-import-sources"
    script: "study-os/scripts/import_sources.py --mode proposal"
    purpose: "Scan subject.yaml raw_source.path read-only and create an import plan."
    inputs:
      - "subject.yaml"
      - "subject.yaml raw_source.path"
    outputs:
      - "working/inventory/import_plan.md"
    checks:
      - "raw_source_is_read_only"
      - "no_files_are_copied"
      - "no_files_are_moved_deleted_renamed_or_modified"
      - "plan_uses_only_approved_inputs_subfolders"

  import_sources_execute:
    skill: "study-os-import-sources"
    script: "study-os/scripts/import_sources.py --mode execute"
    purpose: "Copy approved import-plan rows into inputs/ without overwriting."
    inputs:
      - "subject.yaml"
      - "subject.yaml raw_source.path"
      - "working/inventory/import_plan.md"
    outputs:
      - "inputs/slides/"
      - "inputs/readings/"
      - "inputs/notes/"
      - "inputs/exercises/"
      - "inputs/exams/"
      - "inputs/transcripts/"
      - "inputs/miscellaneous/"
      - "working/inventory/import_log.md"
    checks:
      - "only_rows_marked_copy_are_copied"
      - "destination_files_are_not_overwritten"
      - "raw_source_is_never_modified"
      - "destinations_are_approved_inputs_subfolders"

  inventory:
    skill: "study-os-inventory"
    script: "study-os/scripts/inventory.py"
    purpose: "Scan only imported files under inputs/ and create conceptual planning artifacts."
    inputs:
      - "inputs/"
    outputs:
      - "working/inventory/course_inventory.md"
      - "working/inventory/batch_plan.md"
      - "study-os/state/studyos.sqlite"
    checks:
      - "inventory_scans_only_inputs"
      - "all_imported_sources_are_listed"
      - "batches_are_conceptual_lectures_topics_or_modules"
      - "exercises_are_supporting_sources_unless_explicitly_conceptual"

  process_first_batch:
    skill: "study-os-process-batch"
    purpose: "Process one planned conceptual batch before attempting the rest of the course."
    inputs:
      - "working/inventory/course_inventory.md"
      - "working/inventory/batch_plan.md"
      - "inputs/"
    outputs:
      - "working/digests/"
      - "working/learning-cores/"
      - "outputs/master-notes/"
      - "outputs/formula-sheets/"
      - "outputs/flashcards/"
      - "outputs/exam-questions/"
      - "outputs/cheat-sheets/"
      - "outputs/study-plan/"
      - "review/weak-points.md"
      - "review/unresolved-questions.md"
    checks:
      - "digest_created_before_learning_core"
      - "learning_core_created_before_outputs"
      - "source_coverage_lists_every_assigned_source"
      - "ordinary_exercise_only_batches_do_not_create_master_notes"

  validate_first_batch:
    skill: "study-os-validate"
    purpose: "Validate the first processed batch before continuing."
    inputs:
      - "working/inventory/batch_plan.md"
      - "working/digests/"
      - "working/learning-cores/"
      - "outputs/"
      - "inputs/"
    outputs:
      - "review/validation-report.md"
      - "review/source-coverage.md"
      - "review/formula_validation_report.md"
      - "working/validation/"
    checks:
      - "deterministic_structure_citation_and_formula_checks_run"
      - "llm_review_checks_grounding_clarity_exam_usefulness_and_missing_sources"
      - "severe_issues_stop_processing"

  process_remaining_batches:
    skill: "study-os-process-course"
    purpose: "Process remaining planned batches sequentially, validating each batch before continuing."
    inputs:
      - "working/inventory/course_inventory.md"
      - "working/inventory/batch_plan.md"
      - "inputs/"
      - "review/validation-report.md"
    outputs:
      - "working/digests/"
      - "working/learning-cores/"
      - "outputs/"
      - "review/validation-report.md"
      - "review/source-coverage.md"
      - "review/formula_validation_report.md"
      - "review/progress-tracker.md"
      - "study-os/state/run-log.md"
    checks:
      - "course_is_not_processed_as_one_giant_batch"
      - "each_batch_is_validated_before_the_next_batch"
      - "blocking_validation_issues_stop_the_course_run"

  synthesize:
    skill: "study-os-synthesize"
    purpose: "Create final course-level outputs from validated learning cores and validated batch outputs."
    inputs:
      - "working/inventory/batch_plan.md"
      - "working/learning-cores/"
      - "outputs/"
      - "review/validation-report.md"
      - "review/source-coverage.md"
      - "review/formula_validation_report.md"
      - "review/weak-points.md"
      - "review/unresolved-questions.md"
    outputs:
      - "outputs/final-review-pack/"
    checks:
      - "final_outputs_are_based_on_learning_cores"
      - "synthesis_integrates_across_batches_instead_of_concatenating_only"
      - "source_references_and_unresolved_questions_are_preserved"

  validate_final_synthesis:
    skill: "study-os-validate"
    purpose: "Validate final synthesis after course-level outputs are created."
    inputs:
      - "outputs/final-review-pack/"
      - "working/learning-cores/"
      - "review/"
      - "inputs/"
    outputs:
      - "review/validation-report.md"
      - "review/source-coverage.md"
      - "review/formula_validation_report.md"
    checks:
      - "final_synthesis_is_grounded_in_validated_learning_cores"
      - "citations_resolve_to_inputs"
      - "formula_fields_are_complete"
      - "unresolved_questions_remain_visible"
