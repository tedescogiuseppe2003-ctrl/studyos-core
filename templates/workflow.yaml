# StudyOS workflow.

workflow:
  setup:
    purpose: "Install StudyOS from the external core repo, propose setup, write subject.yaml after approval, and stop."
    outputs:
      - "subject.yaml"
      - "STUDYOS_GUIDE.md"
      - "study-os/"
      - ".agents/skills/"
      - ".claude/skills/"
    checks:
      - "course_material_is_not_imported_or_processed_during_setup"
      - "only_final_skill_names_are_installed"

  import:
    skill: "studyos-import"
    scripts:
      - "study-os/scripts/import_sources.py"
      - "study-os/scripts/inventory.py"
    purpose: "Propose safe import, execute approved copy actions, inventory inputs, and create the first-pass batch plan from metadata."
    modes:
      proposal:
        requires:
          - "subject.yaml"
          - "subject.yaml raw_source.path"
        writes:
          - "analysis/inventory/import_plan.md"
        stops_before:
          - "copying_files"
          - "inventory"
      execute:
        requires:
          - "analysis/inventory/import_plan.md"
          - "user_approval"
        writes:
          - "inputs/"
          - "analysis/inventory/import_log.md"
      inventory:
        requires:
          - "files_under_inputs"
        writes:
          - "analysis/inventory/course_inventory.md"
          - "analysis/inventory/batch_plan.md"
          - "study-os/state/studyos.sqlite"
      full_flow:
        sequence:
          - "proposal_if_import_plan_missing"
          - "stop_for_user_approval"
          - "execute_after_approval"
          - "inventory"
    inputs:
      - "subject.yaml"
      - "subject.yaml raw_source.path"
      - "inputs/"
    outputs:
      - "analysis/inventory/import_plan.md"
      - "analysis/inventory/import_log.md"
      - "analysis/inventory/course_inventory.md"
      - "analysis/inventory/batch_plan.md"
    checks:
      - "raw_source_is_read_only"
      - "original_files_are_never_moved_deleted_or_modified"
      - "destination_files_are_not_overwritten"
      - "destinations_are_restricted_to_approved_inputs_subfolders"
      - "inventory_scans_only_inputs"
      - "missing_import_plan_stops_execute_mode"

  plan:
    skill: "studyos-plan"
    purpose: "Refine the first-pass inventory batch plan into conceptual lectures, topics, modules, or tutorials before processing."
    inputs:
      - "subject.yaml"
      - "analysis/inventory/course_inventory.md"
      - "analysis/inventory/batch_plan.md"
      - "inputs/"
    outputs:
      - "analysis/inventory/batch_plan.md"
      - "analysis/inventory/batch_plan_repair_log.md"
      - "analysis/inventory/processing_queue.md"
    model_routing:
      default: "balanced"
      deep_when:
        - "complex_course_structure"
        - "technical_dependency_chain"
        - "mixed_lecture_tutorial_numbering"
    checks:
      - "batches_are_conceptual_lectures_topics_or_modules"
      - "slides_and_lecture_topic_files_usually_define_primary_batches"
      - "exercises_are_supporting_sources_unless_explicitly_conceptual"
      - "ordinary_exercises_do_not_become_standalone_master_note_batches"
      - "readings_notes_transcripts_and_exams_are_supporting_sources_when_matched"
      - "unclear_files_go_to_unassigned_needs_review"
      - "dependencies_are_added_where_inferable"
      - "all_inventory_files_are_accounted_for"
      - "inputs_are_not_modified"
      - "material_is_not_processed"

  batch:
    skill: "studyos-batch"
    purpose: "Process one planned conceptual batch."
    inputs:
      - "analysis/inventory/course_inventory.md"
      - "analysis/inventory/batch_plan.md"
      - "inputs/"
    outputs:
      - "analysis/batches/"
      - "analysis/visual/"
      - "outputs/"
      - "review/weak-points.md"
      - "review/unresolved-questions.md"
    checks:
      - "digest_created_before_learning_core"
      - "learning_core_created_before_outputs"
      - "source_coverage_lists_every_assigned_source"

  validate:
    skill: "studyos-validate"
    purpose: "Validate processed, repaired, course-level, or merged outputs."
    inputs:
      - "analysis/"
      - "outputs/"
      - "inputs/"
    outputs:
      - "review/validation-report.md"
      - "review/source-coverage.md"
      - "review/formula_validation_report.md"
      - "analysis/validation/"
    checks:
      - "deterministic_checks_run"
      - "blocking_issues_stop_processing"

  course:
    skill: "studyos-course"
    purpose: "Process remaining planned or unprocessed batches sequentially and validate each batch before continuing."
    inputs:
      - "subject.yaml"
      - "analysis/inventory/batch_plan.md"
      - "analysis/inventory/processing_queue.md optional"
      - "analysis/batches/"
      - "outputs/"
      - "review/"
      - "inputs/"
    outputs:
      - "analysis/batches/"
      - "analysis/visual/"
      - "analysis/validation/"
      - "outputs/notes/"
      - "outputs/formulas/"
      - "outputs/flashcards/"
      - "outputs/questions/"
      - "review/"
      - "review/progress-tracker.md"
      - "study-os/state/ optional"
    preflight:
      requires:
        - "analysis/inventory/batch_plan.md"
        - "files_under_inputs"
      optional:
        - "analysis/inventory/processing_queue.md"
      warnings:
        - "Recommended: process and validate one batch manually before full course processing."
    sequence:
      - "preflight"
      - "read_batch_plan"
      - "read_processing_queue_if_present"
      - "identify_planned_unprocessed_stale_or_repairable_failed_batches"
      - "process_each_batch_with_studyos_batch_semantics"
      - "validate_each_batch_before_continuing"
      - "repair_minor_local_issues_when_safe"
      - "revalidate_after_repair"
      - "stop_on_blocking_issues"
      - "report_processed_skipped_stopped_batches"
    parallelism:
      default: "sequential"
      allow_only_if_configured: true
      checks:
        - "no_aggressive_parallelism_by_default"
        - "dependent_batches_are_not_parallelized"
        - "digest_and_learning_core_of_same_batch_are_not_parallelized"
        - "parallel_branches_require_merged_validation_before_downstream_work"
    checks:
      - "course_is_not_processed_as_one_giant_batch"
      - "each_batch_is_validated_before_the_next_batch"
      - "validation_is_not_skipped"
      - "blocking_validation_issues_stop_processing"
      - "essential_unresolved_visual_content_stops_processing"
      - "inputs_are_not_modified"
      - "completion_report_includes_processed_skipped_stopped_validation_unresolved_and_next_skill"

  merge:
    skill: "studyos-merge"
    purpose: "Merge validated batch outputs into full-course deliverables."
    inputs:
      - "analysis/batches/*_learning_core.md"
      - "outputs/notes/Batch_*.md"
      - "outputs/formulas/Batch_*.md"
      - "outputs/flashcards/Batch_*.md"
      - "outputs/questions/Batch_*.md"
      - "review/weak-points.md"
      - "review/unresolved-questions.md"
      - "review/validation-report.md"
    outputs:
      - "outputs/notes/full_course_notes.md"
      - "outputs/formulas/full_formula_sheet.md"
      - "outputs/flashcards/full_flashcards.md"
      - "outputs/questions/full_question_bank.md"
      - "outputs/cheat-sheets/final_cheat_sheet.md"
      - "outputs/study-plan/full_course_study_plan.md"
      - "outputs/final-pack/final_review_pack.md"
    checks:
      - "validated_batch_outputs_are_required"
      - "learning_cores_are_required"
      - "validation_report_is_required"
      - "warn_if_unresolved_blocking_issues_exist"
      - "merged_outputs_are_based_on_validated_material"
      - "merge_does_not_mean_concatenate"
      - "duplicate_concepts_are_consolidated"
      - "notation_is_harmonized"
      - "formulas_are_deduplicated"
      - "dependencies_are_identified"
      - "source_references_and_unresolved_questions_are_preserved"
      - "weak_points_are_prioritized"
      - "likely_exam_questions_are_included"
      - "final_7_day_and_last_48_hour_plans_are_included"
      - "exam_relevant_visual_findings_are_included"

  export:
    skill: "studyos-export"
    purpose: "Export unmerged and merged study outputs to PDF."
    inputs:
      - "outputs/"
    outputs:
      - "exports/pdf/unmerged/"
      - "exports/pdf/merged/"
    checks:
      - "unmerged_exports_preserve_batch_boundaries"
      - "merged_exports_use_full_course_outputs"
